<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) resolve on notched phones and
         gesture-nav Android, which every fixed bar in this app already asks for. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (() => {
        let theme = 'light';
        let language = 'en';
        try {
          theme = localStorage.getItem('ninecube-theme') === 'dark' ? 'dark' : 'light';
          language = localStorage.getItem('ninecube-language') === 'bn' ? 'bn' : 'en';
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = language;
        document.documentElement.dataset.language = language;
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="NineCube.Digital order processing - browse live stock, place orders and manage fulfilment."
    />
    <link rel="icon" type="image/svg+xml" href="./ninecube-mark.svg" />
    <title>NineCube.Digital - Order Processing</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
