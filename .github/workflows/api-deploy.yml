name: Build & Verify API (.NET)

on:
  push:
    branches: [main]
    paths:
      - 'src/NineCube.Api/**'
      - 'src/NineCube.Application/**'
      - 'src/NineCube.Domain/**'
      - 'src/NineCube.Infrastructure/**'
      - 'render.yaml'
      - '.dockerignore'
      - 'tools/deployment-checks/**'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: catalogue_checks
          POSTGRES_DB: ninecube_catalogue_checks
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/NineCube.Api/NineCube.Api.csproj

      - name: Build
        run: dotnet build src/NineCube.Api/NineCube.Api.csproj --configuration Release --no-restore

      - name: Publish (verify publish works)
        run: dotnet publish src/NineCube.Api/NineCube.Api.csproj --configuration Release --output ./publish --no-build

      - name: Docker build check
        run: |
          docker build -f src/NineCube.Api/Dockerfile -t ninecube-api:ci .

      - name: Deployment configuration regression checks
        env:
          CATALOGUE_CHECK_CONNECTION: Host=localhost;Database=ninecube_catalogue_checks;Username=postgres;Password=catalogue_checks
        run: dotnet run --project tools/deployment-checks/DeploymentChecks.csproj --configuration Release
