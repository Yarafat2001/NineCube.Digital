name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Dhaka
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run i18n:check
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ninecube-api.onrender.com' }}
      - name: Install browser for delivery address checks
        run: npx playwright install --with-deps chromium
      - name: Verify delivery addresses in the production build
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/ninecube-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:4173 E2E_DEPLOYMENT_SHA="$GITHUB_SHA" npx playwright test delivery-addresses.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: address-browser-failure
          path: web/test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
