name: ninecube-orderprocessing

# Quick start (reviewer):
#   cp .env.example .env   -> set MSSQL_SA_PASSWORD
#   docker compose up -d
#
# The default profile starts ONLY SQL Server. The API and the frontend are intended to run
# locally with `dotnet run` and `npm run dev` (fastest inner loop). If you prefer everything
# containerised, use:  docker compose --profile full up -d --build

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ninecube-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Read from .env - never committed. Must satisfy SQL Server complexity rules
      # (8+ characters using at least three of upper, lower, digit, symbol).
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}"
    ports:
      - "${MSSQL_HOST_PORT:-14330}:1433"
    volumes:
      - ninecube-mssql-data:/var/opt/mssql
    healthcheck:
      # sqlcmd moved to /opt/mssql-tools18 in recent images; the fallback covers older tags.
      test: >-
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null
        || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: src/NineCube.Api/Dockerfile
    container_name: ninecube-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=NineCubeOrderProcessing;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}"
      NINECUBE_SEED_PASSWORD: "${NINECUBE_SEED_PASSWORD:?NINECUBE_SEED_PASSWORD must be set in .env}"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "5080:8080"

  web:
    profiles: ["full"]
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:5080"
    container_name: ninecube-web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  ninecube-mssql-data:
    name: ninecube-mssql-data
